<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes | Plataforma E-Commerce</title>
</head>
<body>

<header>
    <h1>Plataforma E-Commerce</h1>
    <p>Gestão de clientes</p>


    <nav>
        <a href="/" aria-current="page">Início</a>
        <a href="/pagina/produtos">Produtos</a>
        <a href="/pagina/clientes">Clientes</a>
        <a href="/pagina/pedidos">Pedidos</a>
        <a href="/pagina/carrinhos">Carrinhos</a>
    </nav>

</header>

<main>
    <section>
        <h2 id="titulo-formulario">Cadastrar cliente</h2>

        <form id="form-cliente">
            <label for="tipo">Tipo de cliente</label>
            <select id="tipo" name="tipo" required>
                <option value="B2C">B2C - Consumidor</option>
                <option value="B2B">B2B - Empresa</option>
            </select>

            <label for="nome">Nome / Razão social</label>
            <input type="text" id="nome" name="nome"
                   minlength="3" maxlength="120" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone">

            <div id="campo-cpf">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf">
            </div>

            <div id="campo-cnpj" hidden>
                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" name="cnpj">
            </div>

            <h3>Endereço</h3>

            <label for="logradouro">Logradouro</label>
            <input type="text" id="logradouro" name="logradouro" required>

            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" required>

            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" name="complemento">

            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" name="bairro" required>

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" required>

            <label for="uf">UF</label>
            <input type="text" id="uf" name="uf"
                   minlength="2" maxlength="2" required>

            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep" required>

            <button type="submit" id="btn-salvar">Cadastrar cliente</button>
            <button type="button" id="btn-cancelar" hidden>
                Cancelar edição
            </button>
        </form>

        <p id="mensagem" role="status"></p>
    </section>

    <section>
        <h2>Clientes cadastrados</h2>

        <button type="button" id="btn-atualizar">
            Atualizar lista
        </button>

        <table>
            <thead>
            <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>CPF/CNPJ</th>
                <th>Cidade/UF</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody id="lista-clientes">
            <tr>
                <td colspan="7">Carregando clientes...</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<script src="/js/clientes.js"></script>
</body>
</html>
