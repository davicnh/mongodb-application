
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produtos | Plataforma E-Commerce</title>

    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1>Plataforma E-Commerce</h1>
    <p>Gestão de produtos</p>


    <nav>
        <a href="/" aria-current="page">Início</a>
        <a href="/pagina/produtos">Produtos</a>
        <a href="/pagina/clientes">Clientes</a>
        <a href="/pagina/pedidos">Pedidos</a>
        <a href="/pagina/carrinhos">Carrinhos</a>
    </nav>

</header>

<main>
    <section>
        <h2>Cadastrar produto</h2>

        <form id="form-produto">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>

            <label for="sku">SKU</label>
            <input type="text" id="sku" name="sku" required>

            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" name="categoria" required>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao"></textarea>

            <label for="precoAtual">Preço (R$)</label>
            <input type="number" id="precoAtual" name="precoAtual"
                   min="0.01" step="0.01" required>

            <label for="estoque">Estoque</label>
            <input type="number" id="estoque" name="estoque"
                   min="0" step="1" value="0" required>

            <label>
                <input type="checkbox" id="ativo" name="ativo" checked>
                Produto ativo
            </label>

            <button type="submit">Cadastrar produto</button>
        </form>

        <p id="mensagem" role="status"></p>
    </section>

    <section>
        <h2>Produtos cadastrados</h2>

        <button type="button" id="btn-atualizar">
            Atualizar lista
        </button>

        <table>
            <thead>
            <tr>
                <th>Nome</th>
                <th>SKU</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody id="lista-produtos">
            <tr>
                <td colspan="7">Carregando produtos...</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>


<script src="/js/produtos.js"></script>
</body>
</html>
